[book]
authors = ["The Cowork Team"]
language = "en"
src = "src"
title = "Cowork"

# Expands {#kb editor::Save} and {#action editor::Save} from tools/action-table.json, which the app
# repository writes from its real shortcut table (`make docs-actions`). Needs only Python.
[preprocessor.cowork]
command = "python tools/expand-macros.py"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
smart-punctuation = true
git-repository-url = "https://github.com/nguyendkn/cowork"
# Served from https://nguyendkn.github.io/cowork/ (GitHub project pages).
site-url = "/cowork/"
